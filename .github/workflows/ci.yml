name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run frontend unit tests
        run: node --test "test/*.test.mjs"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm test

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema
        run: npx prisma db push
        env:
          DATABASE_URL: file:./test.db

      - name: Seed database
        run: node prisma/seed.js
        env:
          DATABASE_URL: file:./test.db

      - name: Verify API starts
        run: |
          node src/index.js &
          sleep 3
          curl -f http://localhost:3001/api/health
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: ci-test-secret

  docker-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainlab
          POSTGRES_PASSWORD: trainlab_pw
          POSTGRES_DB: trainlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainlab -d trainlab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t training-lab:ci .

      - name: Run container against PostgreSQL
        run: |
          docker run -d --name app --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e JWT_SECRET=ci-strong-secret-abcdefghijklmnop \
            -e DATABASE_URL="postgresql://trainlab:trainlab_pw@localhost:5432/trainlab" \
            training-lab:ci

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; docker logs app; exit 1

      - name: Seed and smoke-test login
        run: |
          docker exec app node prisma/seed.js
          token=$(curl -s -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"player@traininglab.com","password":"demo1234"}' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write((JSON.parse(s).token)||""))')
          if [ -z "$token" ]; then echo "login failed"; docker logs app; exit 1; fi
          echo "login ok (token length ${#token})"

      - name: Container logs on failure
        if: failure()
        run: docker logs app || true
