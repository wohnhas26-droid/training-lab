<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Dashboard — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Coach Dashboard</h1>
        <p>Manage your team, assign training, and track player development</p>
      </div>

      <div class="card" id="subscription-card" style="margin-bottom: 2rem;"></div>

      <div class="grid grid-4" style="margin-bottom: 2rem;" id="coach-stats"></div>

      <div class="grid grid-2" style="margin-bottom: 2rem;">
        <div class="card">
          <h3 class="card-title">Team Leaderboard</h3>
          <div class="table-wrap" style="margin-top: 1rem;">
            <table id="leaderboard-table">
              <thead><tr><th>Rank</th><th>Player</th><th>XP</th><th>Streak</th><th>Completion</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <h3 class="card-title">Quick Actions</h3>
          <div style="display: grid; gap: 0.75rem; margin-top: 1rem;">
            <a href="/coach/assign.html" class="btn btn-primary btn-block">Assign Training Session</a>
            <a href="/coach/players.html" class="btn btn-secondary btn-block">View Player Progress</a>
            <a href="/coach/feedback.html" class="btn btn-secondary btn-block">Review Player Videos</a>
            <a href="/coach/leaderboard.html" class="btn btn-secondary btn-block">Full Leaderboard</a>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title">Recent Activity</h3>
        <div id="recent-activity" style="margin-top: 1rem;"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import {
      coachTeamStats,
      renderCoachStats,
      renderCoachLeaderboardRows,
      renderCoachActivity,
    } from '/js/components/coachDashboard.js';
    import { renderSubscriptionCard, bindManageBillingButton } from '/js/components/playerProfile.js';
    import { openUrl } from '/js/utils/openUrl.js';
    import '/js/app.js';

    TrainingLab.requireAuth('coach');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('coach', 'dashboard');

    await TrainingLab.ready();
    const snapshot = await TrainingLab.getCoachTeam();
    const players = snapshot.players || [];
    const stats = coachTeamStats(players, snapshot.stats);

    document.getElementById('coach-stats').innerHTML = renderCoachStats(stats);
    document.querySelector('#leaderboard-table tbody').innerHTML = renderCoachLeaderboardRows(players, { escapeHtml });
    document.getElementById('recent-activity').innerHTML = renderCoachActivity(snapshot.activity, { escapeHtml });

    const sub = await TrainingLab.getSubscriptionStatus();
    document.getElementById('subscription-card').innerHTML = renderSubscriptionCard(sub, {
      escapeHtml,
      showWeeklyPlan: false,
    });
    bindManageBillingButton({
      openBillingPortal: TrainingLab.openBillingPortal,
      openUrl,
      showToast: TrainingLab.showToast,
    });
  </script>
</body>
</html>
