<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Review — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Video Skill Review</h1>
        <p>Review uploaded player videos and leave personalized feedback</p>
      </div>
      <div class="grid grid-2" id="video-queue"></div>
      <div class="card" style="margin-top: 1.5rem;">
        <h3 class="card-title">Leave Feedback</h3>
        <form id="feedback-form" style="margin-top: 1rem;">
          <div class="form-group">
            <label class="form-label">Player</label>
            <select class="form-select" name="player" id="feedback-player"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Feedback</label>
            <textarea class="form-textarea" name="feedback" required placeholder="Great first touch, work on scanning before receiving..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Rating (1-10)</label>
            <input type="number" class="form-input" name="rating" min="1" max="10" value="7" style="max-width: 100px;">
          </div>
          <button type="submit" class="btn btn-primary">Submit Feedback</button>
        </form>
      </div>
    </main>
  </div>
  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import { videoPreviewHtml } from '/js/utils/videoEmbed.js';
    import '/js/app.js';

    TrainingLab.requireAuth('coach');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('coach', 'feedback');

    let players = [];
    let videos = [];
    let selectedVideoId = '';

    function relativeDate(iso) {
      if (!iso) return '';
      const then = new Date(iso);
      if (Number.isNaN(then.getTime())) return '';
      const days = Math.floor((Date.now() - then.getTime()) / 86400000);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      return `${days} days ago`;
    }

    function renderVideoQueue(videos) {
      const queue = document.getElementById('video-queue');
      if (!videos.length) {
        queue.innerHTML = '<div class="card"><p style="color: var(--slate-400);">No video submissions yet.</p></div>';
        return;
      }
      queue.innerHTML = videos.map(v => {
        const pending = String(v.status).toLowerCase() === 'pending';
        const statusLabel = pending ? 'Pending Review' : 'Reviewed';
        const when = relativeDate(v.createdAt);
        const selected = String(v.id) === String(selectedVideoId);
        return `
      <div class="card video-card" data-id="${escapeHtml(v.id)}" data-player-id="${escapeHtml(v.playerId || '')}" style="cursor:pointer;${selected ? ' outline: 2px solid var(--green-400);' : ''}">
        <span class="badge ${pending ? 'badge-gold' : 'badge-green'}">${statusLabel}</span>
        <h3 class="card-title" style="margin-top: 0.75rem;">${escapeHtml(v.playerName || 'Player')}</h3>
        <p class="card-subtitle">${escapeHtml(v.skill)} assessment${when ? ` · ${escapeHtml(when)}` : ''}</p>
        ${videoPreviewHtml(v.url, escapeHtml)}
        <p style="margin-top: 0.75rem; font-size: 0.8rem; color: var(--slate-500);">Click to review this clip</p>
      </div>
    `;
      }).join('');
    }

    document.getElementById('video-queue').addEventListener('click', (e) => {
      const card = e.target.closest('.video-card');
      if (!card) return;
      if (e.target.closest('a, button, video, iframe')) return;
      selectedVideoId = card.dataset.id || '';
      const playerSelect = document.getElementById('feedback-player');
      if (card.dataset.playerId && [...playerSelect.options].some(o => o.value === card.dataset.playerId)) {
        playerSelect.value = card.dataset.playerId;
      }
      renderVideoQueue(videos);
    });

    document.getElementById('feedback-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const playerId = fd.get('player');
      const playerName = players.find(p => String(p.id) === String(playerId))?.name || playerId;
      const btn = e.target.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      try {
        await TrainingLab.ready();
        await TrainingLab.submitFeedback({
          playerId,
          playerName,
          feedback: fd.get('feedback'),
          rating: Number(fd.get('rating')) || 7,
          videoId: selectedVideoId || undefined,
        });
        TrainingLab.showToast(selectedVideoId ? 'Feedback submitted and video marked reviewed!' : 'Feedback submitted!');
        e.target.reset();
        selectedVideoId = '';
        videos = await TrainingLab.getCoachVideos();
        renderVideoQueue(videos);
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not submit feedback');
      } finally {
        if (btn) btn.disabled = false;
      }
    });

    await TrainingLab.ready();
    players = await TrainingLab.getCoachTeamData();
    document.getElementById('feedback-player').innerHTML =
      players.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join('');

    videos = await TrainingLab.getCoachVideos();
    renderVideoQueue(videos);
  </script>
</body>
</html>
