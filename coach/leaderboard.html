<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Leaderboard — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Team Leaderboard</h1>
        <p>Rankings based on XP, streaks, and training completion</p>
      </div>
      <div class="card" id="leaderboard"></div>
    </main>
  </div>
  <script type="module">
    import { renderNav, renderSidebar } from '/js/components/ui.js';
    import '/js/app.js';
    TrainingLab.requireAuth('coach');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('coach', 'leaderboard');
    document.getElementById('leaderboard').innerHTML = TrainingLab.getCoachTeamData().map((p, i) => `
      <div style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--slate-800);">
        <span class="leaderboard-rank rank-${i < 3 ? i + 1 : 'other'}">${i + 1}</span>
        <div style="flex: 1;">
          <strong>${p.name}</strong>
          <div style="font-size: 0.85rem; color: var(--slate-500);">${p.position}</div>
        </div>
        <div style="text-align: right;">
          <div style="font-weight: 700; color: var(--green-400);">${p.xp.toLocaleString()} XP</div>
          <div style="font-size: 0.8rem; color: var(--slate-500);">${p.streak} day streak · ${p.completion}% complete</div>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
