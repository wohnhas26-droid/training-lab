<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Leaderboard — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Team Leaderboard</h1>
        <p>Rankings based on XP, streaks, and training completion</p>
      </div>
      <div class="card" id="leaderboard"></div>
    </main>
  </div>
  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import { renderCoachLeaderboardPage } from '/js/components/coachDashboard.js';
    import '/js/app.js';
    TrainingLab.requireAuth('coach');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('coach', 'leaderboard');
    await TrainingLab.ready();
    const teamPlayers = await TrainingLab.getCoachTeamData();
    document.getElementById('leaderboard').innerHTML = renderCoachLeaderboardPage(teamPlayers, { escapeHtml });
  </script>
</body>
</html>
