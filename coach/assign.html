<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Training — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Assign Training</h1>
        <p>Create and assign custom training sessions to your team</p>
      </div>

      <form id="assign-form" class="card" style="max-width: 600px;">
        <div class="form-group">
          <label class="form-label">Session Title</label>
          <input type="text" class="form-input" name="title" required placeholder="e.g. Pre-Match Passing Drill">
        </div>
        <div class="form-group">
          <label class="form-label">Assign To</label>
          <select class="form-select" name="assignTo" id="player-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Category Focus</label>
          <select class="form-select" name="category" id="category-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Due Date</label>
          <input type="date" class="form-input" name="dueDate" required>
        </div>
        <div class="form-group">
          <label class="form-label">Notes for Player</label>
          <textarea class="form-textarea" name="notes" placeholder="Focus on first touch under pressure..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Assign Session</button>
      </form>

      <div class="card" style="margin-top: 2rem;">
        <h3 class="card-title">Assigned Sessions</h3>
        <div id="assignments-list" style="margin-top: 1rem;"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import { renderCoachAssignmentList, renderAssignPlayerOptions, renderAssignCategoryOptions } from '/js/components/assignments.js';
    import '/js/app.js';

    TrainingLab.requireAuth('coach');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('coach', 'assign');

    let players = [];
    let assignments = [];
    let categories = {};

    document.getElementById('player-select').innerHTML = renderAssignPlayerOptions([], { escapeHtml });
    document.getElementById('category-select').innerHTML = renderAssignCategoryOptions([], { escapeHtml });

    document.querySelector('[name="dueDate"]').value = new Date().toISOString().split('T')[0];

    function assignToLabel(assignTo) {
      if (!assignTo || assignTo === 'all') return 'Entire Team';
      return players.find(p => String(p.id) === String(assignTo))?.name || assignTo;
    }

    function renderAssignments() {
      document.getElementById('assignments-list').innerHTML = renderCoachAssignmentList(assignments, {
        categories,
        escapeHtml,
        assignToLabel,
      });
    }

    document.getElementById('assign-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = e.target.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      try {
        await TrainingLab.ready();
        const created = await TrainingLab.createAssignment({
          title: fd.get('title'),
          category: fd.get('category'),
          dueDate: fd.get('dueDate'),
          notes: fd.get('notes'),
          assignTo: fd.get('assignTo'),
        });
        assignments.unshift(created);
        TrainingLab.showToast('Training assigned!');
        e.target.reset();
        document.querySelector('[name="dueDate"]').value = new Date().toISOString().split('T')[0];
        renderAssignments();
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not assign training');
      } finally {
        if (btn) btn.disabled = false;
      }
    });

    renderAssignments();

    await TrainingLab.ready();
    players = await TrainingLab.getCoachTeamData();
    document.getElementById('player-select').innerHTML = renderAssignPlayerOptions(players, { escapeHtml });
    const catalog = await TrainingLab.getCatalog();
    categories = catalog.categories;
    document.getElementById('category-select').innerHTML =
      renderAssignCategoryOptions(catalog.categories, { escapeHtml });
    assignments = await TrainingLab.getAssignments();
    renderAssignments();
  </script>
</body>
</html>
