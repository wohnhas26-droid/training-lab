<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Your Progress</h1>
        <p>Track your development from Rookie to Professional</p>
      </div>

      <div class="card" style="margin-bottom: 2rem;">
        <h3 class="card-title">Progression Level</h3>
        <div id="level-track" style="margin-top: 1.5rem;"></div>
      </div>

      <div class="grid grid-4" style="margin-bottom: 2rem;" id="progress-stats"></div>

      <div class="card" style="margin-bottom: 2rem;">
        <h3 class="card-title">Achievements</h3>
        <div class="grid grid-4" id="achievements-grid" style="margin-top: 1rem;"></div>
      </div>

      <div class="card" style="margin-bottom: 2rem;">
        <h3 class="card-title">Submit a Skill Video for Review</h3>
        <p class="card-subtitle" style="margin: 0.5rem 0 1rem;">Send a clip to your coach for personalized feedback.</p>
        <form id="video-form" style="display: grid; gap: 0.75rem; max-width: 520px;">
          <div class="form-group">
            <label class="form-label">Skill</label>
            <select class="form-select" name="skill" id="video-skill" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Video link (optional)</label>
            <input type="url" class="form-input" name="url" placeholder="https://...">
          </div>
          <button type="submit" class="btn btn-primary" style="justify-self: start;">Submit for Review</button>
        </form>
        <div id="my-videos" style="margin-top: 1.5rem;"></div>
      </div>

      <div class="card" style="margin-bottom: 2rem;">
        <h3 class="card-title">Coach Feedback</h3>
        <p class="card-subtitle" style="margin: 0.5rem 0 1rem;">Notes from your coach after sessions and video reviews.</p>
        <div id="coach-feedback-list"></div>
      </div>

      <div class="card" id="evaluation-card" style="display: none;">
        <h3 class="card-title">Monthly Evaluation <span class="badge badge-gold">Elite</span></h3>
        <div id="evaluation-content" style="margin-top: 1rem;"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import '/js/app.js';
    import { PROGRESSION_LEVELS } from '/js/data/levels.js';

    const state = TrainingLab.requireAuth('player');
    if (!state) throw new Error('Auth required');

    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('player', 'progress');

    const summary = TrainingLab.getProgressSummary();

    document.getElementById('level-track').innerHTML = PROGRESSION_LEVELS.map(level => {
      const reached = summary.xp >= level.minXp;
      return `
        <div style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem 0; border-bottom: 1px solid var(--slate-800); opacity: ${reached ? 1 : 0.4};">
          <span style="font-size: 1.5rem;">${level.icon}</span>
          <div style="flex: 1;">
            <div style="font-weight: 700; color: ${reached ? 'var(--green-400)' : 'var(--slate-400)'};">${level.name}</div>
            <div style="font-size: 0.8rem; color: var(--slate-500);">${level.minXp} XP required</div>
          </div>
          ${reached ? '<span class="badge badge-green">Unlocked</span>' : ''}
        </div>
      `;
    }).join('');

    document.getElementById('progress-stats').innerHTML = `
      <div class="stat-card"><div class="stat-value">${summary.streak}</div><div class="stat-label">Current Streak</div></div>
      <div class="stat-card"><div class="stat-value">${summary.skillsCompleted}</div><div class="stat-label">Skills Completed</div></div>
      <div class="stat-card"><div class="stat-value">${summary.weeklySessions}</div><div class="stat-label">Sessions This Week</div></div>
      <div class="stat-card"><div class="stat-value">${summary.minutesTrained}</div><div class="stat-label">Total Minutes</div></div>
    `;

    document.getElementById('achievements-grid').innerHTML = TrainingLab.ACHIEVEMENTS.map(a => {
      const unlocked = state.achievements.includes(a.id);
      return `
        <div class="achievement ${unlocked ? 'unlocked' : ''}">
          <div class="achievement-icon">${a.icon}</div>
          <div class="achievement-name">${a.name}</div>
          <div style="font-size: 0.7rem; color: var(--slate-500); margin-top: 0.25rem;">${a.description}</div>
        </div>
      `;
    }).join('');

    // Skill video submissions
    const videoSkill = document.getElementById('video-skill');
    videoSkill.innerHTML = Object.values(TrainingLab.TRAINING_CATEGORIES)
      .map(c => `<option value="${c.name}">${c.name}</option>`).join('');

    function renderMyVideos(videos) {
      const el = document.getElementById('my-videos');
      if (!videos.length) {
        el.innerHTML = '<p style="color: var(--slate-500);">No submissions yet.</p>';
        return;
      }
      el.innerHTML = videos.map(v => {
        const pending = String(v.status).toLowerCase() === 'pending';
        return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem 0; border-bottom:1px solid var(--slate-800);">
          <div><strong>${v.skill}</strong>${v.url ? ` · <a href="${v.url}" target="_blank" rel="noopener" style="color: var(--green-400);">link</a>` : ''}</div>
          <span class="badge ${pending ? 'badge-gold' : 'badge-green'}">${pending ? 'Pending Review' : 'Reviewed'}</span>
        </div>`;
      }).join('');
    }

    let myVideos = [];
    document.getElementById('video-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = e.target.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      try {
        await TrainingLab.ready();
        const created = await TrainingLab.submitVideo({ skill: fd.get('skill'), url: fd.get('url') });
        myVideos.unshift(created);
        TrainingLab.showToast('Video submitted for review!');
        e.target.reset();
        renderMyVideos(myVideos);
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not submit video');
      } finally {
        if (btn) btn.disabled = false;
      }
    });

    renderMyVideos(myVideos);
    (async () => {
      await TrainingLab.ready();
      myVideos = await TrainingLab.getMyVideos();
      renderMyVideos(myVideos);
    })();

    function formatFeedbackDate(value) {
      if (!value) return '';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return escapeHtml(value);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderCoachFeedback(items) {
      const el = document.getElementById('coach-feedback-list');
      const list = Array.isArray(items) ? items : [];
      // Player view: API items have feedback/rating/date. Ignore coach-offline
      // records that only stored a `player` name from submitting feedback.
      const received = list.filter((f) => f && (f.feedback || f.rating) && !f.player);
      if (!received.length) {
        el.innerHTML = '<p style="color: var(--slate-500);">No coach feedback yet. After your coach reviews a session or video, notes will show up here.</p>';
        return;
      }
      el.innerHTML = received.map((f) => {
        const who = escapeHtml(f.coachName || 'Your coach');
        const when = formatFeedbackDate(f.date);
        const rating = Number.isFinite(Number(f.rating)) ? `${Number(f.rating)}/10` : '';
        return `
          <div style="padding: 1rem 0; border-bottom: 1px solid var(--slate-800);">
            <div style="display:flex; justify-content:space-between; gap: 1rem; align-items:baseline; flex-wrap:wrap;">
              <strong style="color: var(--slate-200);">${who}</strong>
              <span style="font-size: 0.85rem; color: var(--slate-500);">${when}${rating ? ` · <span class="badge badge-green">${escapeHtml(rating)}</span>` : ''}</span>
            </div>
            <p style="margin-top: 0.5rem; color: var(--slate-300);">${escapeHtml(f.feedback)}</p>
          </div>`;
      }).join('');
    }

    renderCoachFeedback(state.coachFeedback);
    (async () => {
      await TrainingLab.ready();
      const fresh = TrainingLab.loadState();
      renderCoachFeedback(fresh.coachFeedback);
    })();

    if (state.subscription === 'elite') {
      const evaluation = TrainingLab.generateEvaluation(state.profile || {}, state.progress);
      document.getElementById('evaluation-card').style.display = 'block';
      document.getElementById('evaluation-content').innerHTML = `
        <p style="font-size: 2rem; font-weight: 800; color: var(--green-400);">${evaluation.overallRating}/10</p>
        <p style="margin: 1rem 0; color: var(--slate-300);">${evaluation.recommendation}</p>
        <div class="grid grid-2" style="margin-top: 1rem;">
          <div><strong style="color: var(--green-400);">Strengths</strong><ul style="margin-top: 0.5rem; padding-left: 1.25rem; color: var(--slate-400);">${evaluation.strengths.map(s => `<li>${s}</li>`).join('')}</ul></div>
          <div><strong style="color: var(--gold);">Improve</strong><ul style="margin-top: 0.5rem; padding-left: 1.25rem; color: var(--slate-400);">${evaluation.improvements.map(s => `<li>${s}</li>`).join('')}</ul></div>
        </div>
      `;
    }
  </script>
</body>
</html>
