<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Training — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Today's Training Session</h1>
        <p id="session-meta"></p>
      </div>

      <div class="card" style="margin-bottom: 1.5rem;">
        <h3 class="card-title">Coach Assignments</h3>
        <div id="assignments-list" style="margin-top: 1rem;"></div>
      </div>

      <div class="card" id="session-progress-card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <div>
            <span class="badge badge-green" id="session-progress-badge">0% Complete</span>
          </div>
          <div id="session-timer" style="font-size: 1.5rem; font-weight: 700; color: var(--green-400);">00:00</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="session-progress-bar" style="width: 0%"></div></div>
      </div>

      <div id="exercise-list"></div>

      <button id="complete-session-btn" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.5rem; display: none;">
        Complete Session 🎉
      </button>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, difficultyBadge, escapeHtml } from '/js/components/ui.js';
    import { renderPlayerAssignmentList } from '/js/components/assignments.js';
    import { renderSessionExercises } from '/js/components/trainingSession.js';
    import { renderTodayTrainingLoadFailed } from '/js/components/playerProgress.js';
    import '/js/app.js';

    const state = TrainingLab.requireAuth('player');
    if (!state) throw new Error('Auth required');

    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('player', 'training');

    await TrainingLab.ready();
    const catalog = await TrainingLab.getCatalog();
    const categories = catalog.categories;
    const current = TrainingLab.loadState();
    const session = await TrainingLab.getTodayTraining();
    const completed = new Set(
      (current.completedSessions || [])
        .filter(s => s.date === new Date().toISOString().split('T')[0])
        .flatMap(s => s.exercises)
    );

    let doneCount = 0;
    const totalExercises = session?.exercises?.length || 0;
    let timerSeconds = 0;
    let timerInterval = null;

    if (!session) {
      document.getElementById('session-meta').textContent = '';
      document.getElementById('session-progress-card').style.display = 'none';
      document.getElementById('exercise-list').innerHTML =
        `<div class="card">${renderTodayTrainingLoadFailed()}</div>`;
    } else {
      document.getElementById('session-meta').textContent =
        session.rest || !session.focus?.length
          ? 'Recovery day'
          : `${session.focus.join(' · ')} — ~${session.estimatedMinutes || 0} minutes`;
    }

    function updateProgress() {
      const pct = totalExercises ? Math.round((doneCount / totalExercises) * 100) : 0;
      document.getElementById('session-progress-badge').textContent = `${pct}% Complete`;
      document.getElementById('session-progress-bar').style.width = `${pct}%`;
      document.getElementById('complete-session-btn').style.display =
        doneCount === totalExercises && totalExercises > 0 ? 'block' : 'none';
    }

    function formatTime(s) {
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function renderExercises() {
      if (!session) return;
      const list = document.getElementById('exercise-list');
      const items = session.exercises || [];
      doneCount = items.filter((ex) => completed.has(ex.id)).length;
      list.innerHTML = renderSessionExercises(items, {
        escapeHtml,
        difficultyBadge,
        completedIds: completed,
        categories,
      });

      if (!items.length) return;

      updateProgress();

      if (!timerInterval && totalExercises > 0) {
        timerInterval = setInterval(() => {
          timerSeconds++;
          document.getElementById('session-timer').textContent = formatTime(timerSeconds);
        }, 1000);
      }

      list.querySelectorAll('.exercise-item:not(.completed)').forEach(item => {
        item.addEventListener('click', () => {
          item.classList.add('completed');
          item.querySelector('.exercise-check').textContent = '✓';
          doneCount++;
          updateProgress();
        });
      });
    }

    renderExercises();

    const assignmentList = document.getElementById('assignments-list');

    async function loadAssignments() {
      await TrainingLab.ready();
      const items = await TrainingLab.getMyAssignments();
      assignmentList.innerHTML = renderPlayerAssignmentList(items, { categories, escapeHtml });
    }

    assignmentList.addEventListener('click', async (e) => {
      const btn = e.target.closest('.assignment-complete');
      if (!btn) return;
      btn.disabled = true;
      try {
        await TrainingLab.completeAssignment(btn.dataset.id);
        TrainingLab.showToast('Assignment complete!');
        await loadAssignments();
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not complete assignment');
        btn.disabled = false;
      }
    });

    loadAssignments();

    if (session) document.getElementById('complete-session-btn').addEventListener('click', async () => {
      const btn = document.getElementById('complete-session-btn');
      const exerciseIds = session.exercises.map(e => e.id);
      const totalXp = session.exercises.reduce((s, e) => s + e.xp, 0);
      const minutes = session.exercises.reduce((s, e) => s + e.duration, 0);

      btn.disabled = true;
      try {
        await TrainingLab.ready();
        await TrainingLab.completeSession(`session-${Date.now()}`, exerciseIds, totalXp, minutes);
        const newState = TrainingLab.loadState();
        const unlocked = await TrainingLab.checkAchievements(newState);

        clearInterval(timerInterval);
        TrainingLab.showToast(`Session complete! +${totalXp} XP earned`);

        if (unlocked.length) {
          setTimeout(() => TrainingLab.showToast(`Achievement unlocked: ${unlocked[0].name}!`), 1500);
        }

        setTimeout(() => window.location.href = '/player/dashboard.html', 2000);
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not complete session');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
