<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>My Profile</h1>
        <p>Your training profile powers your personalized development plan</p>
      </div>

      <div class="grid grid-2">
        <div class="card" id="profile-info"></div>
        <div class="card" id="plan-info"></div>
      </div>

      <div class="card" style="margin-top: 1.5rem;">
        <h3 class="card-title">Edit Profile</h3>
        <p class="card-subtitle" style="margin: 0.5rem 0 1rem;">Update your details — this shapes your personalized plan.</p>
        <form id="profile-form" style="display: grid; gap: 0.75rem; max-width: 640px;">
          <div class="grid grid-2" style="gap: 0.75rem;">
            <div class="form-group"><label class="form-label">Age</label><input type="number" class="form-input" name="age" min="6" max="99"></div>
            <div class="form-group"><label class="form-label">Position</label>
              <select class="form-select" name="position">
                <option value="goalkeeper">Goalkeeper</option>
                <option value="defender">Defender</option>
                <option value="midfielder">Midfielder</option>
                <option value="winger">Winger</option>
                <option value="striker">Striker</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Skill Level</label>
              <select class="form-select" name="skillLevel">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
                <option value="elite">Elite</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Training Days / week</label>
              <select class="form-select" name="trainingDays">
                <option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option>
              </select>
            </div>
          </div>
          <div class="form-group"><label class="form-label">Goals (comma-separated)</label><input type="text" class="form-input" name="goals" placeholder="passing, first touch"></div>
          <div class="form-group"><label class="form-label">Improvement Areas (comma-separated)</label><input type="text" class="form-input" name="improvementAreas" placeholder="ball_mastery, passing"></div>
          <div class="form-group"><label class="form-label">Equipment (comma-separated)</label><input type="text" class="form-input" name="equipment" placeholder="ball, cones, wall"></div>
          <button type="submit" class="btn btn-primary" style="justify-self: start;">Save Profile</button>
        </form>
      </div>

      <div class="card" style="margin-top: 1.5rem;">
        <h3 class="card-title">Regenerate Training Plan</h3>
        <p class="card-subtitle" style="margin: 0.5rem 0 1rem;">Update your profile and rebuild your 4-week AI development plan.</p>
        <button class="btn btn-primary" id="regenerate-btn">Regenerate Plan</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, capitalize } from '/js/components/ui.js';
    import { openUrl } from '/js/utils/openUrl.js';
    import '/js/app.js';
    import { saveWeeklyPlan } from '/js/services/storage.js';

    const state = TrainingLab.requireAuth('player');
    if (!state) throw new Error('Auth required');

    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('player', 'profile');

    let profile = state.profile || {};
    const planNames = {
      player: 'Player Membership',
      elite: 'Elite Membership',
      team: 'Team Membership',
    };

    function statusBadge(status) {
      const labels = {
        active: ['Active', 'badge-green'],
        trialing: ['Free Trial', 'badge-gold'],
        past_due: ['Past Due', 'badge-purple'],
        canceled: ['Canceled', 'badge-blue'],
      };
      const [label, cls] = labels[status] || ['Unknown', 'badge-blue'];
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function renderProfileInfo() {
      document.getElementById('profile-info').innerHTML = `
      <h3 class="card-title">${state.user.name}</h3>
      <p class="card-subtitle" style="margin-bottom: 1rem;">${state.user.email}</p>
      <div style="display: grid; gap: 0.75rem;">
        <div><span style="color: var(--slate-500);">Age:</span> ${profile.age || '—'}</div>
        <div><span style="color: var(--slate-500);">Position:</span> ${capitalize(profile.position || '—')}</div>
        <div><span style="color: var(--slate-500);">Skill Level:</span> ${capitalize(profile.skillLevel || '—')}</div>
        <div><span style="color: var(--slate-500);">Training Days:</span> ${profile.trainingDays || '—'} / week</div>
        <div><span style="color: var(--slate-500);">Goals:</span> ${(profile.goals || []).join(', ') || '—'}</div>
        <div><span style="color: var(--slate-500);">Equipment:</span> ${(profile.equipment || []).join(', ') || '—'}</div>
      </div>
    `;
    }
    renderProfileInfo();

    // Prefill and wire the edit form.
    const toCsv = (arr) => (Array.isArray(arr) ? arr.join(', ') : (arr || ''));
    const csvToArr = (s) => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
    function pform() { return document.getElementById('profile-form'); }
    function pform_prefill() {
      pform().age.value = profile.age || '';
      pform().position.value = profile.position || 'midfielder';
      pform().skillLevel.value = profile.skillLevel || 'intermediate';
      pform().trainingDays.value = String(profile.trainingDays || 5);
      pform().goals.value = toCsv(profile.goals);
      pform().improvementAreas.value = toCsv(profile.improvementAreas);
      pform().equipment.value = toCsv(profile.equipment);
    }
    pform_prefill();

    pform().addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = e.target.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      try {
        await TrainingLab.ready();
        const updated = await TrainingLab.updateProfile({
          age: parseInt(fd.get('age'), 10) || undefined,
          position: fd.get('position'),
          skillLevel: fd.get('skillLevel'),
          trainingDays: parseInt(fd.get('trainingDays'), 10) || 5,
          goals: csvToArr(fd.get('goals')),
          improvementAreas: csvToArr(fd.get('improvementAreas')),
          equipment: csvToArr(fd.get('equipment')),
        });
        profile = (updated && updated.profile) ? updated.profile : profile;
        renderProfileInfo();
        pform_prefill();
        TrainingLab.showToast('Profile updated!');
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not update profile');
      } finally {
        if (btn) btn.disabled = false;
      }
    });

    async function renderSubscription() {
      await TrainingLab.ready();
      const sub = await TrainingLab.getSubscriptionStatus();
      const plan = sub.plan || state.subscription || 'player';
      const periodEnd = sub.currentPeriodEnd
        ? new Date(sub.currentPeriodEnd).toLocaleDateString()
        : null;

      document.getElementById('plan-info').innerHTML = `
        <h3 class="card-title">Subscription</h3>
        <p style="font-size: 1.5rem; font-weight: 700; color: var(--green-400); margin: 1rem 0;">${planNames[plan] || plan}</p>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;">
          ${statusBadge(sub.status)}
          ${plan === 'elite' ? '<span class="badge badge-gold">AI Personal Training</span>' : ''}
        </div>
        ${periodEnd ? `<p style="color: var(--slate-400); font-size: 0.9rem;">Current period ends: ${periodEnd}</p>` : ''}
        <p style="color: var(--slate-400); margin-top: 1rem; font-size: 0.9rem;">
          Weekly plan generated: ${state.weeklyPlan?.generatedAt ? new Date(state.weeklyPlan.generatedAt).toLocaleDateString() : 'Not yet'}
        </p>
        <div style="display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap;">
          <a href="/pricing.html" class="btn btn-secondary btn-sm">Change Plan</a>
          ${sub.hasBillingAccount && sub.stripeConfigured
            ? '<button class="btn btn-ghost btn-sm" id="manage-billing-btn">Manage Billing</button>'
            : ''}
        </div>
      `;

      document.getElementById('manage-billing-btn')?.addEventListener('click', async () => {
        try {
          const portal = await TrainingLab.openBillingPortal();
          if (portal.url) await openUrl(portal.url);
        } catch (err) {
          TrainingLab.showToast(err.message || 'Could not open billing portal');
        }
      });
    }

    renderSubscription();

    document.getElementById('regenerate-btn').addEventListener('click', () => {
      const newPlan = TrainingLab.generatePersonalizedPlan(profile);
      saveWeeklyPlan(newPlan);
      TrainingLab.showToast('Training plan regenerated!');
    });
  </script>
</body>
</html>
