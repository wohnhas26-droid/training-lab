<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>My Profile</h1>
        <p>Your training profile powers your personalized development plan</p>
      </div>

      <div class="grid grid-2">
        <div class="card" id="profile-info"></div>
        <div class="card" id="plan-info"></div>
      </div>

      <div class="card" style="margin-top: 1.5rem;">
        <h3 class="card-title">Edit Profile</h3>
        <p class="card-subtitle" style="margin: 0.5rem 0 1rem;">Update your details — this shapes your personalized plan.</p>
        <form id="profile-form" style="display: grid; gap: 0.75rem; max-width: 640px;">
          <div class="grid grid-2" style="gap: 0.75rem;">
            <div class="form-group"><label class="form-label">Age</label><input type="number" class="form-input" name="age" min="6" max="99"></div>
            <div class="form-group"><label class="form-label">Position</label>
              <select class="form-select" name="position">
                <option value="goalkeeper">Goalkeeper</option>
                <option value="defender">Defender</option>
                <option value="midfielder">Midfielder</option>
                <option value="winger">Winger</option>
                <option value="striker">Striker</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Skill Level</label>
              <select class="form-select" name="skillLevel">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
                <option value="elite">Elite</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Training Days / week</label>
              <select class="form-select" name="trainingDays">
                <option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option>
              </select>
            </div>
          </div>
          <div class="form-group"><label class="form-label">Goals (comma-separated)</label><input type="text" class="form-input" name="goals" placeholder="Passing, First Touch"></div>
          <div class="form-group"><label class="form-label">Improvement Areas (comma-separated)</label><input type="text" class="form-input" name="improvementAreas" placeholder="ball mastery, passing"></div>
          <div class="form-group"><label class="form-label">Equipment (comma-separated)</label><input type="text" class="form-input" name="equipment" placeholder="Ball, Cones, Wall"></div>
          <button type="submit" class="btn btn-primary" style="justify-self: start;">Save Profile</button>
        </form>
      </div>

      <div class="card" style="margin-top: 1.5rem;">
        <h3 class="card-title">Regenerate Training Plan</h3>
        <p class="card-subtitle" style="margin: 0.5rem 0 1rem;">Update your profile and rebuild your 4-week AI development plan.</p>
        <button class="btn btn-primary" id="regenerate-btn">Regenerate Plan</button>
      </div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, capitalize, escapeHtml, formatProfileLabel } from '/js/components/ui.js';
    import { renderProfileCard, renderSubscriptionCard } from '/js/components/playerProfile.js';
    import { focusListToCsv, csvToCategoryIds } from '/js/services/trainingPlanner.js';
    import { openUrl } from '/js/utils/openUrl.js';
    import '/js/app.js';
    const state = TrainingLab.requireAuth('player');
    if (!state) throw new Error('Auth required');

    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('player', 'profile');

    await TrainingLab.ready();
    const fresh = TrainingLab.loadState();
    let user = fresh.user || state.user;
    let profile = fresh.profile || {};
    let weeklyPlan = fresh.weeklyPlan;

    function renderProfileInfo() {
      document.getElementById('profile-info').innerHTML = renderProfileCard(user, profile, { escapeHtml, capitalize });
    }
    renderProfileInfo();

    // Prefill and wire the edit form.
    const csvToArr = (s) => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
    function pform() { return document.getElementById('profile-form'); }
    function pform_prefill() {
      pform().age.value = profile.age || '';
      pform().position.value = profile.position || 'midfielder';
      pform().skillLevel.value = profile.skillLevel || 'intermediate';
      pform().trainingDays.value = String(profile.trainingDays || 5);
      pform().goals.value = focusListToCsv(profile.goals);
      pform().improvementAreas.value = focusListToCsv(profile.improvementAreas);
      pform().equipment.value = (Array.isArray(profile.equipment) ? profile.equipment : [])
        .map((item) => formatProfileLabel(item))
        .filter(Boolean)
        .join(', ');
    }
    pform_prefill();

    pform().addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = e.target.querySelector('button[type="submit"]');
      if (btn) btn.disabled = true;
      try {
        await TrainingLab.ready();
        const updated = await TrainingLab.updateProfile({
          age: parseInt(fd.get('age'), 10) || undefined,
          position: fd.get('position'),
          skillLevel: fd.get('skillLevel'),
          trainingDays: parseInt(fd.get('trainingDays'), 10) || 5,
          goals: csvToArr(fd.get('goals')).map((g) => g.toLowerCase()),
          improvementAreas: csvToCategoryIds(fd.get('improvementAreas')),
          equipment: csvToArr(fd.get('equipment')).map((item) => item.toLowerCase()),
        });
        profile = (updated && updated.profile) ? updated.profile : profile;
        if (updated?.user) user = updated.user;
        renderProfileInfo();
        pform_prefill();
        TrainingLab.showToast('Profile updated!');
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not update profile');
      } finally {
        if (btn) btn.disabled = false;
      }
    });

    async function renderSubscription() {
      const sub = await TrainingLab.getSubscriptionStatus();
      document.getElementById('plan-info').innerHTML = renderSubscriptionCard(sub, {
        weeklyPlan,
        escapeHtml,
      });

      document.getElementById('manage-billing-btn')?.addEventListener('click', async () => {
        try {
          const portal = await TrainingLab.openBillingPortal();
          if (portal.url) await openUrl(portal.url);
        } catch (err) {
          TrainingLab.showToast(err.message || 'Could not open billing portal');
        }
      });
    }

    renderSubscription();

    document.getElementById('regenerate-btn').addEventListener('click', async () => {
      const btn = document.getElementById('regenerate-btn');
      btn.disabled = true;
      try {
        await TrainingLab.ready();
        const plan = await TrainingLab.regeneratePlan();
        const generated = document.getElementById('plan-generated');
        if (generated) {
          generated.textContent = plan?.generatedAt
            ? `Weekly plan generated: ${new Date(plan.generatedAt).toLocaleDateString()}`
            : 'Weekly plan generated: just now';
        }
        TrainingLab.showToast('Training plan regenerated!');
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not regenerate plan');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
