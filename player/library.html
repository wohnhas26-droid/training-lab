<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Library — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Training Library</h1>
        <p>Browse all exercises by category — <span id="exercise-count"></span> drills available</p>
      </div>

      <div class="form-group" style="max-width: 300px; margin-bottom: 1.5rem;">
        <select class="form-select" id="category-filter">
          <option value="all">All Categories</option>
        </select>
      </div>

      <div id="library-grid" class="grid grid-2"></div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, escapeHtml, getCategoryName, difficultyBadge } from '/js/components/ui.js';
    import {
      normalizeCategories,
      completedExerciseIds,
      filterExercises,
      renderCategoryOptions,
      renderLibraryCards,
    } from '/js/components/library.js';
    import '/js/app.js';

    TrainingLab.requireAuth('player');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('player', 'library');

    const filter = document.getElementById('category-filter');
    let exercises = [];
    let completedIds = new Set();

    function renderLibrary(category = 'all') {
      document.getElementById('library-grid').innerHTML = renderLibraryCards(
        filterExercises(exercises, category),
        { escapeHtml, getCategoryName, difficultyBadge, completedIds },
      );
    }

    filter.addEventListener('change', () => renderLibrary(filter.value));

    await TrainingLab.ready();
    const catalog = await TrainingLab.getCatalog();
    exercises = Array.isArray(catalog.exercises) ? catalog.exercises : [];
    completedIds = completedExerciseIds(TrainingLab.loadState());
    filter.innerHTML = renderCategoryOptions(normalizeCategories(catalog.categories), { escapeHtml });
    document.getElementById('exercise-count').textContent = String(exercises.length);
    renderLibrary();
  </script>
</body>
</html>
