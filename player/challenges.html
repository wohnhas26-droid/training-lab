<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenges — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Challenges</h1>
        <p>Push your limits and earn bonus XP with monthly skill challenges</p>
      </div>

      <div class="grid grid-2" id="challenges-grid"></div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import '/js/app.js';

    const state = TrainingLab.requireAuth('player');
    if (!state) throw new Error('Auth required');

    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('player', 'challenges');

    function statusFor(current, challenge) {
      const progress = current.challengeProgress[challenge.id] || 0;
      if ((current.completedChallenges || []).includes(challenge.id) || progress >= challenge.targetCount) {
        return 'completed';
      }
      if ((current.activeChallenges || []).includes(challenge.id)) return 'active';
      return 'available';
    }

    function renderChallenges() {
      const current = TrainingLab.loadState();
      document.getElementById('challenges-grid').innerHTML = TrainingLab.CHALLENGES.map(c => {
        const progress = current.challengeProgress[c.id] || 0;
        const pct = Math.min(100, Math.round((progress / c.targetCount) * 100));
        const status = statusFor(current, c);

        let action = `
          <button class="btn btn-primary btn-block challenge-join" data-id="${escapeHtml(c.id)}" style="margin-top: 1rem;">
            Join Challenge
          </button>`;
        if (status === 'completed') {
          action = `
            <div class="challenge-progress">
              <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem;">
                <span>${progress}/${c.targetCount} ${escapeHtml(c.unit)}</span>
                <span>100%</span>
              </div>
              <div class="progress-bar"><div class="progress-fill" style="width: 100%"></div></div>
              <span class="badge badge-green" style="margin-top: 0.75rem; display: inline-block;">Completed</span>
            </div>`;
        } else if (status === 'active') {
          action = `
            <div class="challenge-progress">
              <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.5rem;">
                <span>${progress}/${c.targetCount} ${escapeHtml(c.unit)}</span>
                <span>${pct}%</span>
              </div>
              <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
              <button class="btn btn-secondary btn-sm btn-block challenge-log" data-id="${escapeHtml(c.id)}" style="margin-top: 0.75rem;">
                Log Progress (+1)
              </button>
            </div>`;
        }

        return `
          <div class="challenge-card">
            <div style="display: flex; justify-content: space-between; align-items: start;">
              <div>
                <span style="font-size: 2rem;">${c.icon}</span>
                <h3 class="card-title" style="margin-top: 0.5rem;">${escapeHtml(c.name)}</h3>
              </div>
              <span class="badge ${status === 'completed' ? 'badge-green' : 'badge-gold'}">+${c.xpReward} XP</span>
            </div>
            <p style="color: var(--slate-400); margin: 0.75rem 0; font-size: 0.9rem;">${escapeHtml(c.description)}</p>
            <p style="font-size: 0.8rem; color: var(--slate-500);">${c.duration} days · Target: ${c.targetCount} ${escapeHtml(c.unit)}</p>
            ${action}
          </div>
        `;
      }).join('');
    }

    const grid = document.getElementById('challenges-grid');
    grid.addEventListener('click', async (e) => {
      const joinBtn = e.target.closest('.challenge-join');
      const logBtn = e.target.closest('.challenge-log');
      const btn = joinBtn || logBtn;
      if (!btn) return;
      btn.disabled = true;
      await TrainingLab.ready();
      try {
        if (joinBtn) {
          await TrainingLab.joinChallenge(joinBtn.dataset.id);
          TrainingLab.showToast('Challenge joined!');
        } else {
          const result = await TrainingLab.updateChallengeProgress(logBtn.dataset.id, 1);
          const challenge = TrainingLab.CHALLENGES.find(c => c.id === logBtn.dataset.id);
          if (result?.newlyCompleted || result?.challengeCompleted) {
            TrainingLab.showToast(`Challenge complete! +${challenge.xpReward} XP`);
          } else {
            const current = TrainingLab.loadState();
            const progress = current.challengeProgress[logBtn.dataset.id] || 0;
            if (progress >= challenge.targetCount) {
              TrainingLab.showToast(`Challenge complete! +${challenge.xpReward} XP`);
            } else {
              TrainingLab.showToast('Progress logged!');
            }
          }
        }
        await TrainingLab.checkAchievements(TrainingLab.loadState());
        renderChallenges();
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not update challenge');
        btn.disabled = false;
      }
    });

    renderChallenges();
  </script>
</body>
</html>
