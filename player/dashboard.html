<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Welcome back, <span id="user-name"></span> 👋</h1>
        <p id="today-focus"></p>
      </div>

      <div class="grid grid-4" style="margin-bottom: 2rem;" id="stats-grid"></div>

      <div class="grid grid-2" style="margin-bottom: 2rem;">
        <div class="card">
          <h3 class="card-title">Today's Training</h3>
          <div id="today-session" style="margin-top: 1rem;"></div>
          <div id="session-cta"></div>
        </div>
        <div class="card">
          <h3 class="card-title">Your Level</h3>
          <div id="level-info" style="margin-top: 1rem;"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 2rem;">
        <h3 class="card-title">Coach Assignments</h3>
        <div id="assignments-list" style="margin-top: 1rem;"></div>
      </div>

      <div class="card">
        <h3 class="card-title">Weekly Schedule</h3>
        <div class="grid grid-4" id="weekly-schedule" style="margin-top: 1rem;"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import { renderPlayerAssignmentList } from '/js/components/assignments.js';
    import { renderDashboardStats, renderLevelInfo, renderSessionCta, renderProgressSummaryLoadFailed, renderTodayTrainingLoadFailed } from '/js/components/playerProgress.js';
    import '/js/app.js';
    import { getDayName } from '/js/services/storage.js';
    import { daysFromWeeklyPlan, renderWeeklySchedule } from '/js/utils/weeklySchedule.js';

    const state = TrainingLab.requireAuth('player');
    if (!state) throw new Error('Auth required');

    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('player', 'dashboard');
    document.getElementById('user-name').textContent = state.user.name.split(' ')[0];

    const today = getDayName();

    function renderSession(session) {
      if (!session) {
        document.getElementById('today-focus').textContent = '';
        document.getElementById('today-session').innerHTML = renderTodayTrainingLoadFailed();
        document.getElementById('session-cta').innerHTML = '';
        return;
      }

      document.getElementById('today-focus').textContent =
        session.rest || !session.focus?.length
          ? 'Rest day — focus on recovery'
          : `Today: ${session.focus.join(' · ')}`;

      const exercises = session.exercises || [];
      document.getElementById('today-session').innerHTML = exercises.length
        ? `<p style="color: var(--slate-400); margin-bottom: 0.75rem;">${exercises.length} exercises · ~${session.estimatedMinutes || 0} min</p>` +
          exercises.slice(0, 3).map(e => `<div style="padding: 0.5rem 0; border-bottom: 1px solid var(--slate-800);">${escapeHtml(e.name)}</div>`).join('') +
          (exercises.length > 3 ? `<p style="color: var(--slate-500); margin-top: 0.5rem; font-size: 0.85rem;">+${exercises.length - 3} more</p>` : '')
        : '<p style="color: var(--slate-400);">Rest and recovery day. Light mobility work recommended.</p>';

      document.getElementById('session-cta').innerHTML = renderSessionCta(session);
    }

    function renderWeek(weeklyPlan) {
      const days = daysFromWeeklyPlan(weeklyPlan);
      document.getElementById('weekly-schedule').innerHTML = renderWeeklySchedule(days, today, { escapeHtml });
    }

    renderSession(TrainingLab.getTodaySession(state.weeklyPlan));
    renderWeek(state.weeklyPlan);

    await TrainingLab.ready();
    const catalog = await TrainingLab.getCatalog();
    const categories = catalog.categories;
    const summary = await TrainingLab.getProgressSummary();
    if (!summary) {
      document.getElementById('stats-grid').innerHTML =
        `<div class="card" style="grid-column: 1 / -1;">${renderProgressSummaryLoadFailed()}</div>`;
      document.getElementById('level-info').innerHTML = renderProgressSummaryLoadFailed();
    } else {
      document.getElementById('stats-grid').innerHTML = renderDashboardStats(summary);
      document.getElementById('level-info').innerHTML = renderLevelInfo(summary);
    }

    const current = TrainingLab.loadState();
    const session = await TrainingLab.getTodayTraining();
    renderSession(session);
    renderWeek(current.weeklyPlan);

    const assignmentList = document.getElementById('assignments-list');

    async function loadAssignments() {
      await TrainingLab.ready();
      const items = await TrainingLab.getMyAssignments();
      assignmentList.innerHTML = renderPlayerAssignmentList(items, { categories, escapeHtml });
    }

    assignmentList.addEventListener('click', async (e) => {
      const btn = e.target.closest('.assignment-complete');
      if (!btn) return;
      btn.disabled = true;
      try {
        await TrainingLab.completeAssignment(btn.dataset.id);
        TrainingLab.showToast('Assignment complete!');
        await loadAssignments();
      } catch (err) {
        TrainingLab.showToast(err.message || 'Could not complete assignment');
        btn.disabled = false;
      }
    });

    loadAssignments();
  </script>
</body>
</html>
