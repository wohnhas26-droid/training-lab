<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Training Attendance</h1>
        <p>Track which days your player completed training</p>
      </div>
      <div class="card">
        <div class="grid grid-4" id="attendance-grid"></div>
      </div>
    </main>
  </div>
  <script type="module">
    import { renderNav, renderSidebar } from '/js/components/ui.js';
    import '/js/app.js';

    TrainingLab.requireAuth('parent');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('parent', 'attendance');

    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    // Dates (YYYY-MM-DD) for the current week, Monday→Sunday.
    function currentWeekDates() {
      const now = new Date();
      const dow = (now.getDay() + 6) % 7; // 0 = Monday
      const monday = new Date(now);
      monday.setDate(now.getDate() - dow);
      return days.map((_, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return d.toISOString().split('T')[0];
      });
    }

    await TrainingLab.ready();
    const current = TrainingLab.loadState();
    const child = current.children?.[0];
    const childReport = child ? await TrainingLab.getChildReport(child.id).catch(() => null) : null;

    let attended;
    if (childReport) {
      const sessionDates = new Set((childReport.player.completedSessions || []).map(s => s.date));
      attended = currentWeekDates().map(date => sessionDates.has(date));
    } else {
      attended = [true, true, false, true, true, false, false];
    }

    document.getElementById('attendance-grid').innerHTML = days.map((d, i) => `
      <div style="text-align: center; padding: 1rem;">
        <div style="width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
          background: ${attended[i] ? 'rgba(16,185,129,0.2)' : 'var(--slate-800)'};
          border: 2px solid ${attended[i] ? 'var(--green-500)' : 'var(--slate-700)'};">
          ${attended[i] ? '✓' : '—'}
        </div>
        <div style="font-weight: 600;">${d}</div>
      </div>
    `).join('');
  </script>
</body>
</html>
