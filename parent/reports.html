<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Cards — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Monthly Report Cards</h1>
        <p id="page-subtitle">Monthly training summaries scored from session activity.</p>
        <p id="report-note" style="color: var(--slate-400); margin-top: 0.5rem;">These scores reflect training volume and consistency. They are not Elite monthly evaluations.</p>
      </div>
      <div id="report-cards" class="grid grid-2"></div>
    </main>
  </div>
  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import { bindLinkPlayerForm, renderLinkPlayerCard } from '/js/components/parentChild.js';
    import {
      REPORTS_INTRO,
      REPORTS_NOTE,
      reportsSubtitleForChild,
      reportsFailedSubtitle,
      renderReportsFailed,
      renderParentReportCard,
    } from '/js/components/parentReports.js';
    import '/js/app.js';

    TrainingLab.requireAuth('parent');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('parent', 'reports');
    document.getElementById('page-subtitle').textContent = REPORTS_INTRO;
    document.getElementById('report-note').textContent = REPORTS_NOTE;

    function renderEmpty() {
      document.getElementById('page-subtitle').textContent = 'Link a player to see real report cards — we never invent scores.';
      document.getElementById('report-cards').className = '';
      document.getElementById('report-cards').innerHTML = renderLinkPlayerCard({ escapeHtml });
      bindLinkPlayerForm({ onLinked: () => load() });
    }

    async function load() {
      await TrainingLab.ready();
      const current = TrainingLab.loadState();
      const child = current.children?.[0];
      if (!child) {
        renderEmpty();
        return;
      }
      const reports = await TrainingLab.getChildReports(child.id).catch(() => null);
      if (!reports) {
        document.getElementById('page-subtitle').textContent = reportsFailedSubtitle(child.name);
        document.getElementById('report-cards').className = '';
        document.getElementById('report-cards').innerHTML = renderReportsFailed();
        return;
      }
      if (!reports.length) {
        document.getElementById('page-subtitle').textContent = `No monthly reports yet for ${child.name}`;
        document.getElementById('report-cards').className = '';
        document.getElementById('report-cards').innerHTML = '<div class="card"><p style="color: var(--slate-500);">No training months to score yet.</p></div>';
        return;
      }
      document.getElementById('page-subtitle').textContent = reportsSubtitleForChild(child.name);
      document.getElementById('report-cards').className = 'grid grid-2';
      document.getElementById('report-cards').innerHTML = reports.map((r) => renderParentReportCard(r, { escapeHtml })).join('');
    }

    load();
  </script>
</body>
</html>
