<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Cards — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Monthly Report Cards</h1>
        <p>Detailed monthly evaluations of your player's development</p>
      </div>
      <div id="report-cards" class="grid grid-2"></div>
    </main>
  </div>
  <script type="module">
    import { renderNav, renderSidebar } from '/js/components/ui.js';
    import '/js/app.js';

    TrainingLab.requireAuth('parent');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('parent', 'reports');

    await TrainingLab.ready();
    const current = TrainingLab.loadState();
    const child = current.children?.[0];
    const childReport = child ? await TrainingLab.getChildReport(child.id).catch(() => null) : null;

    const monthLabel = new Date().toLocaleString(undefined, { month: 'long', year: 'numeric' });

    let card;
    if (childReport) {
      const p = childReport.player;
      const score = Math.max(1, Math.min(10, Math.round((childReport.streak || 0) / 3) + 5));
      card = {
        score,
        consistency: childReport.consistency,
        skills: p.progress.skillsCompleted,
        activeChallenges: (p.activeChallenges || []).length,
        feedback: (p.coachFeedback || []).length ? `${p.coachFeedback.length} coach note(s)` : 'None yet',
      };
    } else {
      card = { score: 8, consistency: 'Excellent', skills: 42, activeChallenges: 1, feedback: 'Available' };
    }

    document.getElementById('report-cards').innerHTML = `
      <div class="card">
        <h3 class="card-title">${monthLabel} Report Card</h3>
        <p style="font-size: 2rem; font-weight: 800; color: var(--green-400); margin: 1rem 0;">${card.score}/10</p>
        <ul style="color: var(--slate-400); font-size: 0.9rem; padding-left: 1.25rem;">
          <li>Training consistency: ${card.consistency}</li>
          <li>Skills completed: ${card.skills}</li>
          <li>Active challenges: ${card.activeChallenges}</li>
          <li>Coach feedback: ${card.feedback}</li>
        </ul>
      </div>
      <div class="card" style="opacity: 0.75;">
        <h3 class="card-title">Earlier months</h3>
        <p style="color: var(--slate-400); font-size: 0.9rem;">Monthly report history will appear here as your player logs more training over time.</p>
      </div>
    `;
  </script>
</body>
</html>
