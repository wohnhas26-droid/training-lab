<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Cards — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Monthly Report Cards</h1>
        <p>Detailed monthly evaluations of your player's development</p>
      </div>
      <div id="report-cards" class="grid grid-2"></div>
    </main>
  </div>
  <script type="module">
    import { renderNav, renderSidebar } from '/js/components/ui.js';
    import '/js/app.js';

    TrainingLab.requireAuth('parent');
    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('parent', 'reports');

    await TrainingLab.ready();
    const current = TrainingLab.loadState();
    const child = current.children?.[0];

    const reports = child ? await TrainingLab.getChildReports(child.id) : null;

    function cardHtml(r) {
      return `
      <div class="card"${r.sessions === 0 ? ' style="opacity: 0.7;"' : ''}>
        <h3 class="card-title">${r.label} Report Card</h3>
        <p style="font-size: 2rem; font-weight: 800; color: var(--green-400); margin: 1rem 0;">${r.score}/10</p>
        <ul style="color: var(--slate-400); font-size: 0.9rem; padding-left: 1.25rem;">
          <li>Training consistency: ${r.consistency}</li>
          <li>Sessions completed: ${r.sessions}</li>
          <li>Minutes trained: ${r.minutes}</li>
          <li>Skills practiced: ${r.skills}</li>
        </ul>
      </div>`;
    }

    if (reports && reports.length) {
      document.getElementById('report-cards').innerHTML = reports.map(cardHtml).join('');
    } else {
      // Offline/demo fallback: a single illustrative current-month card.
      const monthLabel = new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' });
      document.getElementById('report-cards').innerHTML = cardHtml({
        label: monthLabel, score: 8, consistency: 'Excellent', sessions: 10, minutes: 300, skills: 24,
      });
    }
  </script>
</body>
</html>
