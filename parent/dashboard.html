<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>
  <div class="dashboard">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h1>Parent Dashboard</h1>
        <p id="page-subtitle">Monitor your player's training progress and development</p>
      </div>
      <div id="parent-content"></div>
    </main>
  </div>

  <script type="module">
    import { renderNav, renderSidebar, escapeHtml } from '/js/components/ui.js';
    import { bindLinkPlayerForm, renderLinkPlayerCard } from '/js/components/parentChild.js';
    import '/js/app.js';
    import { ACHIEVEMENTS, getLevelForXp } from '/js/data/levels.js';

    const state = TrainingLab.requireAuth('parent');
    if (!state) throw new Error('Auth required');

    document.getElementById('nav').innerHTML = renderNav();
    document.getElementById('sidebar').innerHTML = renderSidebar('parent', 'dashboard');

    const content = document.getElementById('parent-content');

    function renderEmpty() {
      document.getElementById('page-subtitle').textContent = 'Link a player to see real training data — we never invent progress.';
      content.innerHTML = renderLinkPlayerCard({ escapeHtml });
      bindLinkPlayerForm({ onLinked: () => load() });
    }

    function renderReport(child, childReport) {
      const xp = childReport.player.progress.xp;
      const level = getLevelForXp(xp).current;
      const report = {
        weeklyCompletion: childReport.weeklyCompletion,
        streak: childReport.streak,
        consistency: childReport.consistency,
        goalsAchieved: childReport.goalsAchieved,
        minutesThisWeek: childReport.minutesThisWeek,
        skillProgression: `${level.name} (${xp} XP)`,
      };
      const achievements = childReport.player.achievements || [];
      const feedback = childReport.player.coachFeedback || [];

      document.getElementById('page-subtitle').textContent = `Monitoring ${child.name}'s training`;

      content.innerHTML = `
        <div class="grid grid-4" style="margin-bottom: 2rem;">
          <div class="stat-card"><div class="stat-value">${escapeHtml(String(report.weeklyCompletion.split('/')[0]))}</div><div class="stat-label">Sessions This Week</div></div>
          <div class="stat-card"><div class="stat-value">${Number(report.streak)}</div><div class="stat-label">Day Streak</div></div>
          <div class="stat-card"><div class="stat-value">${escapeHtml(report.consistency)}</div><div class="stat-label">Consistency</div></div>
          <div class="stat-card"><div class="stat-value">${Number(report.goalsAchieved)}</div><div class="stat-label">Achievements</div></div>
        </div>
        <div class="grid grid-2">
          <div class="card">
            <h3 class="card-title">Weekly Training Summary</h3>
            <div style="margin-top: 1rem;">
              <p style="margin-bottom: 1rem; color: var(--slate-300);">Training completion: <strong>${escapeHtml(report.weeklyCompletion)}</strong></p>
              <p style="color: var(--slate-400);">Minutes trained this week: <strong>${Number(report.minutesThisWeek) || 0}</strong></p>
              <div class="progress-bar" style="margin-top: 1rem;"><div class="progress-fill" style="width: ${(parseInt(report.weeklyCompletion, 10) / 7) * 100}%"></div></div>
            </div>
          </div>
          <div class="card">
            <h3 class="card-title">Skill Progression</h3>
            <div style="margin-top: 1rem;">
              <div class="level-badge" style="margin-bottom: 1rem;">${escapeHtml(report.skillProgression)}</div>
              <p style="color: var(--slate-400); font-size: 0.9rem;">Keep encouraging daily training.</p>
            </div>
          </div>
        </div>
        <div class="card" style="margin-top: 1.5rem;">
          <h3 class="card-title">Goals Achieved</h3>
          <div style="margin-top: 1rem;">
            ${achievements.map(id => {
              const a = ACHIEVEMENTS.find(x => x.id === id);
              return a ? `<span class="badge badge-green" style="margin: 0.25rem;">${escapeHtml(a.icon)} ${escapeHtml(a.name)}</span>` : '';
            }).join('') || '<p style="color: var(--slate-500);">No achievements yet.</p>'}
          </div>
        </div>
        <div class="card" style="margin-top: 1.5rem;">
          <h3 class="card-title">Coach Feedback</h3>
          <div style="margin-top: 1rem;">
            ${feedback.length
              ? feedback.slice(0, 3).map(f => `
                <div style="padding: 0.75rem 0; border-bottom: 1px solid var(--slate-800);">
                  <p style="color: var(--slate-200);">${escapeHtml(f.feedback)}</p>
                  <p style="font-size: 0.8rem; color: var(--slate-500); margin-top: 0.35rem;">
                    ${escapeHtml(f.coachName || 'Coach')} · ${escapeHtml(f.date || '')}${f.rating != null ? ` · ${Number(f.rating)}/10` : ''}
                  </p>
                </div>`).join('')
              : '<p style="color: var(--slate-500);">No coach notes yet.</p>'}
          </div>
        </div>
        <p style="margin-top: 1.5rem;">
          <button type="button" class="btn btn-ghost btn-sm" id="unlink-btn" style="color: #f87171;">Unlink ${escapeHtml(child.name)}</button>
        </p>
      `;

      document.getElementById('unlink-btn')?.addEventListener('click', async () => {
        if (!confirm(`Unlink ${child.name}? You will stop seeing their training data.`)) return;
        try {
          await TrainingLab.removeChild(child.id);
          TrainingLab.showToast('Player unlinked');
          load();
        } catch (err) {
          TrainingLab.showToast(err.message || 'Could not unlink player');
        }
      });
    }

    async function load() {
      await TrainingLab.ready();
      const current = TrainingLab.loadState();
      const child = current.children?.[0];
      if (!child) {
        renderEmpty();
        return;
      }
      const childReport = await TrainingLab.getChildReport(child.id).catch(() => null);
      if (!childReport) {
        document.getElementById('page-subtitle').textContent = `Could not load ${child.name}'s training right now.`;
        content.innerHTML = '<div class="card"><p style="color: var(--slate-500);">Try again in a moment.</p></div>';
        return;
      }
      renderReport(child, childReport);
    }

    load();
  </script>
</body>
</html>
