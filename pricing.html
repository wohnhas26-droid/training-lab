<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing — Futbol Training Lab</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="nav"></div>

  <section class="hero" style="padding: 3rem 1.5rem 2rem;">
    <h1>Choose Your Plan</h1>
    <p>Flexible subscriptions for every level — from individual players to full academies.</p>
    <p id="stripe-notice" style="margin-top: 1rem; font-size: 0.9rem; color: var(--slate-500); display: none;"></p>
  </section>

  <section class="section container" id="canceled-banner" style="display: none;">
    <div class="card" style="border-color: var(--gold); text-align: center;">
      <p id="canceled-copy" style="color: var(--slate-300);">Checkout was canceled. Pick a plan when you're ready — your 7-day trial starts at signup.</p>
    </div>
  </section>

  <section class="section container">
    <div class="grid grid-3" id="pricing-grid" style="max-width: 1100px; margin: 0 auto;"></div>
  </section>

  <footer class="footer">
    <p id="pricing-footer-note">&copy; 2026 Futbol Training Lab. All plans include a 7-day free trial.</p>
    <p class="footer-links">
      <a href="/privacy.html">Privacy Policy</a>
      <span aria-hidden="true"> · </span>
      <a href="/terms.html">Terms of Service</a>
    </p>
  </footer>

  <script type="module">
    import { renderNav, formatPrice, hasSavedUser, savedUserRole } from '/js/components/ui.js';
    import { pricingFooterCopy, pricingCanceledCopy } from '/js/components/billingCopy.js';
    import { pricingPlansForUser, planAllowedForRole, PLAN_NOT_AVAILABLE, ALREADY_ON_PLAN, SWITCH_VIA_BILLING, pricingPlanAction } from '/js/data/subscriptions.js';
    import { billingPortalHref } from '/js/components/playerProfile.js';
    import { setToken } from '/js/services/api.js';
    import { openUrl } from '/js/utils/openUrl.js';
    import '/js/app.js';

    document.getElementById('nav').innerHTML = renderNav('pricing');

    if (new URLSearchParams(window.location.search).get('canceled') === 'true') {
      document.getElementById('canceled-banner').style.display = 'block';
    }

    let currentSub = { plan: null, status: null, hasBillingAccount: false, stripeConfigured: false };

    function renderPlan(plan) {
      const priceDisplay = plan.priceMax
        ? `$${plan.price}–$${plan.priceMax}`
        : formatPrice(plan.price);
      const action = pricingPlanAction(plan.id, {
        loggedIn: hasSavedUser(),
        currentPlan: currentSub.plan,
        status: currentSub.status,
      });
      const btnClass = action.disabled || !plan.featured ? 'btn-secondary' : 'btn-primary';

      return `
        <div class="pricing-card ${plan.featured ? 'featured' : ''}">
          ${plan.featured ? '<span class="badge badge-green" style="position:absolute;top:1rem;right:1rem;">Most Popular</span>' : ''}
          <div class="plan-name">${plan.name}</div>
          <p style="color: var(--slate-400); font-size: 0.9rem; margin-top: 0.5rem;">${plan.description}</p>
          <div class="plan-price">${priceDisplay}<span>/${plan.period}</span></div>
          <ul class="feature-list">
            ${plan.features.map(f => `<li>${f}</li>`).join('')}
          </ul>
          <button type="button" class="btn ${btnClass} btn-block checkout-btn" data-plan="${plan.id}" ${action.disabled ? 'disabled' : ''}>
            ${action.label}
          </button>
        </div>
      `;
    }

    function renderGrid() {
      document.getElementById('pricing-grid').innerHTML =
        pricingPlansForUser(savedUserRole()).map(renderPlan).join('');
      document.querySelectorAll('.checkout-btn').forEach(btn => {
        btn.addEventListener('click', () => handleCheckout(btn.dataset.plan));
      });
    }

    async function handleCheckout(plan) {
      await TrainingLab.ready();

      if (!hasSavedUser()) {
        window.location.href = `/onboarding.html?plan=${plan}`;
        return;
      }

      if (!planAllowedForRole(savedUserRole(), plan)) {
        TrainingLab.showToast(PLAN_NOT_AVAILABLE);
        return;
      }

      const action = pricingPlanAction(plan, {
        loggedIn: true,
        currentPlan: currentSub.plan,
        status: currentSub.status,
      });
      if (action.disabled) {
        TrainingLab.showToast(ALREADY_ON_PLAN);
        return;
      }

      const btn = document.querySelector(`.checkout-btn[data-plan="${plan}"]`);

      if (action.switchPlan) {
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Opening billing...';
        }
        try {
          if (currentSub.hasBillingAccount && currentSub.stripeConfigured) {
            const portal = await TrainingLab.openBillingPortal();
            await openUrl(billingPortalHref(portal));
            return;
          }
          throw new Error(SWITCH_VIA_BILLING);
        } catch (err) {
          TrainingLab.showToast(err.message || SWITCH_VIA_BILLING);
          if (btn) {
            btn.disabled = false;
            btn.textContent = action.label;
          }
        }
        return;
      }
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Redirecting...';
      }

      try {
        const result = await TrainingLab.createCheckout(plan);
        if (result.url) {
          await openUrl(result.url);
        } else {
          throw new Error(result.message || 'Checkout unavailable');
        }
      } catch (err) {
        const message = err.message || 'Checkout failed';
        TrainingLab.showToast(message);
        if (/auth|session expired|invalid or expired token/i.test(message)) {
          setToken(null);
          window.location.href = `/onboarding.html?plan=${plan}`;
          return;
        }
        if (btn) {
          btn.disabled = false;
          btn.textContent = action.label;
        }
      }
    }

    renderGrid();

    await TrainingLab.ready();
    if (hasSavedUser()) {
      try {
        const sub = await TrainingLab.getSubscriptionStatus();
        currentSub = {
          plan: sub?.plan || null,
          status: sub?.status || null,
          hasBillingAccount: Boolean(sub?.hasBillingAccount),
          stripeConfigured: Boolean(sub?.stripeConfigured),
        };
        renderGrid();
      } catch {
        // Keep Subscribe until status loads.
      }
    }
    const stripeConfig = await TrainingLab.getStripeConfig();
    const configured = Boolean(stripeConfig.configured);
    document.getElementById('pricing-footer-note').textContent = pricingFooterCopy(configured);
    document.getElementById('canceled-copy').textContent = pricingCanceledCopy(configured);
    if (!configured) {
      const notice = document.getElementById('stripe-notice');
      notice.textContent = 'Demo mode — Stripe not configured. Subscriptions will simulate locally.';
      notice.style.display = 'block';
    }
  </script>
</body>
</html>
